name: Portal CI

on:
  push:
    branches: [main]
    paths: ["apps/portal/**", "package.json", "package-lock.json", ".github/workflows/ci-portal.yml"]
  pull_request:
    paths: ["apps/portal/**", "package.json", "package-lock.json", ".github/workflows/ci-portal.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/portal
      - run: npm run test:coverage --workspace=apps/portal
      - run: npm run build --workspace=apps/portal
        env:
          NEXT_PUBLIC_API_URL: https://terios-api.onrender.com
          NEXT_PUBLIC_PORTAL_URL: https://app.terioscoach.com
          NEXT_PUBLIC_WEBSITE_URL: https://terioscoach.com
