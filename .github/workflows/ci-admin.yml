name: ci-admin

on:
  push:
    branches: [main]
    paths: ["apps/admin/**", ".github/workflows/ci-admin.yml"]
  pull_request:
    paths: ["apps/admin/**"]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/admin

      - name: Test with coverage
        # Coverage thresholds live in vitest.config.mts and fail the run
        # on their own, so there is no separate gate step here.
        run: npm run test:coverage --workspace=apps/admin

      # Advisories in the dependency tree. `--audit-level=high` on
      # purpose: failing on every low-severity transitive advisory trains
      # everyone to ignore the step, which is how a critical one gets
      # ignored too.
      - name: Dependency audit
        run: npm audit --audit-level=high --workspaces --include-workspace-root

      - name: Build
        run: npm run build --workspace=apps/admin

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: apps/admin
