<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New enquiry</title></head>
<body style="margin:0;padding:0;background:#FAF7F2;font-family:Figtree,'Segoe UI',Arial,sans-serif;color:#1F2922;">
  <div style="max-width:560px;margin:0 auto;padding:40px 24px;">
    <p style="font-family:Georgia,'Times New Roman',serif;font-size:22px;color:#3B6B54;margin:0 0 32px;">Terios Wellness Spa</p>
    <h1 style="font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;margin:0 0 16px;">New enquiry from {{senderName}}</h1>
    <div style="background:#FDFCFA;border:1px solid #E7DFD0;border-radius:10px;padding:20px 24px;margin:0 0 24px;">
      <p style="margin:0 0 8px;font-size:13px;color:#6E6350;text-transform:uppercase;letter-spacing:0.06em;">From</p>
      <p style="margin:0 0 16px;font-size:15px;">{{senderName}} &lt;{{senderEmail}}&gt;</p>
      <p style="margin:0 0 8px;font-size:13px;color:#6E6350;text-transform:uppercase;letter-spacing:0.06em;">Message</p>
      <p style="margin:0;font-size:15px;line-height:1.6;white-space:pre-wrap;">{{message}}</p>
    </div>
    <a href="{{dashboardUrl}}" style="display:inline-block;background:#3B6B54;color:#FDFCFA;text-decoration:none;font-size:15px;font-weight:600;padding:12px 28px;border-radius:10px;">Open in dashboard</a>
    <p style="font-size:12px;color:#AE9F82;margin:32px 0 0;">Terios practice dashboard notification</p>
  </div>
</body>
</html>
